name: ao_vivo

# Leitura do candle EM FORMAÇÃO (343m, 686m, 1D), só sob demanda.
# Não mexe na branch dados nem nos Logs: grava ao_vivo.json na branch ao-vivo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recupera cache dos candles (só leitura)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: candles-${{ github.run_id }}
          restore-keys: candles-

      - name: Calcula candle em formação
        run: python -m raicher.ao_vivo --out ao_vivo.json

      - name: Publica na branch ao-vivo
        run: |
          mkdir pub && cp ao_vivo.json pub/ && cd pub
          git init -q -b ao-vivo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "ao vivo $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ao-vivo
